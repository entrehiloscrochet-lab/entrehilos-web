import org.gradle.api.GradleException

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def loadEnvConfig = {
    def envMap = [:]
    def candidates = [
        new File(rootProject.projectDir.parentFile, '.env'),
        new File(rootProject.projectDir.parentFile, '.env.local')
    ]
    candidates.each { File envFile ->
        if (envFile.exists()) {
            envFile.eachLine('UTF-8') { String line ->
                def trimmed = line.trim()
                if (!trimmed || trimmed.startsWith('#')) return
                if (trimmed.startsWith('export ')) {
                    trimmed = trimmed.substring(7).trim()
                }
                def eqIdx = trimmed.indexOf('=')
                if (eqIdx <= 0) return
                def key = trimmed.substring(0, eqIdx).trim()
                def value = trimmed.substring(eqIdx + 1).trim()
                if ((value.startsWith('"') && value.endsWith('"') && value.length() >= 2) ||
                    (value.startsWith("'") && value.endsWith("'") && value.length() >= 2)) {
                    value = value.substring(1, value.length() - 1)
                }
                envMap[key] = value
            }
        }
    }
    return envMap
}

def dotEnv = loadEnvConfig()
def supabaseUrl = (System.getenv('NEXT_PUBLIC_SUPABASE_URL') ?: dotEnv['NEXT_PUBLIC_SUPABASE_URL'] ?: '').trim().replaceAll('/+$', '')
def supabaseAnonKey = (System.getenv('NEXT_PUBLIC_SUPABASE_ANON_KEY') ?: dotEnv['NEXT_PUBLIC_SUPABASE_ANON_KEY'] ?: '').trim()
def webAdminUrl = (System.getenv('NEXT_PUBLIC_APP_URL') ?: 'https://entrehilos-web.vercel.app').trim().replaceAll('/+$', '') + '/admin'

if (!supabaseUrl || !supabaseAnonKey) {
    throw new GradleException(
        'Faltan NEXT_PUBLIC_SUPABASE_URL o NEXT_PUBLIC_SUPABASE_ANON_KEY en .env, .env.local o variables de entorno.'
    )
}

def escapeForBuildConfig = { String val ->
    return val.replace('\\', '\\\\').replace('"', '\\"')
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "pe.entrehilos.admin"
    compileSdk 34

    defaultConfig {
        applicationId "pe.entrehilos.admin"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "2.4.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        buildConfigField "String", "SUPABASE_URL", "\"${escapeForBuildConfig(supabaseUrl)}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${escapeForBuildConfig(supabaseAnonKey)}\""
        buildConfigField "String", "WEB_ADMIN_URL", "\"${escapeForBuildConfig(webAdminUrl)}\""
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.14'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
